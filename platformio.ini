; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = attiny24

[env:attiny24]
platform = atmelavr
board = attiny24
build_unflags = -std=gnu++11 -std=c++11 -O0 -O1 -O2 -O3 -Ofast
; Optimize firmware size and enable link-time optimization.
platform_packages = 
    toolchain-atmelavr@symlink://C:\Toolchains\avr-gcc-16
build_flags = -std=gnu++17 -Wall -Wextra -Werror -Os -flto -mbranch-cost=1 -mrelax
board_build.f_cpu = 8000000L

upload_protocol = usbasp
test_ignore = test_*

[env:native]
platform = native
test_framework = custom
test_build_src = no
test_filter = test_*
test_ignore = test_hal
build_flags = -std=gnu++17 -Wall -Wextra -Werror

[env:native_hal]
platform = native
test_framework = custom
test_build_src = yes
build_src_filter = +<DisplayController.cpp>
test_filter = test_hal
build_flags = -std=gnu++17 -Wall -Wextra -Werror